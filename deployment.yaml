apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-deploy
  labels:
    app: htmlapp
    project: fashion-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: htmlapp
  template:
    metadata:
      labels:
        app: htmlapp
        project: fashion-hub
    spec:
      containers:
      - name: html-container
        image: html-docker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: html-service
  labels:
    app: htmlapp
    project: fashion-hub
spec:
  type: ClusterIP
  selector:
    app: htmlapp
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
