name: Fashion Hub checks

on:
  push:
    branches:
      - blackboxai/deploy
  pull_request:
    branches:
      - blackboxai/deploy

permissions:
  contents: read

jobs:
  frontend-syntax:
    name: Check frontend JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript files
        run: find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

  edge-functions:
    name: Check Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Functions
        run: deno task lint

      - name: Type-check Edge Functions
        run: deno task check
