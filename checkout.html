<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Hub - Checkout</title><link rel="stylesheet" href="style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<nav><div class="logo">Fashion Hub</div><ul><li><a href="cart.html">Back to Cart</a></li><li><a href="collection.html">Continue Shopping</a></li></ul></nav>
<section class="cart-section">
<h1>Secure Checkout</h1>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:start;">
<div class="cart-summary" style="margin-top:0;padding:28px;">
<h2>Delivery Address</h2>
<div id="checkoutAddressForm">
<form id="shippingAddressForm" style="width:100%;max-width:none;margin:18px 0 0;" onsubmit="startRazorpayCheckout(event)">
<label for="recipient_name">Full name</label><input id="recipient_name" name="recipient_name" autocomplete="name" required maxlength="120">
<label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required>
<label for="address_line1">House / street address</label><input id="address_line1" name="address_line1" autocomplete="address-line1" required maxlength="250">
<label for="address_line2">Area / landmark (optional)</label><input id="address_line2" name="address_line2" autocomplete="address-line2" maxlength="250">
<label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required maxlength="100">
<label for="state">State</label><input id="state" name="state" autocomplete="address-level1" required maxlength="100">
<label for="postal_code">PIN code</label><input id="postal_code" name="postal_code" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{6}" required>
<button class="checkout-btn" id="placeOrderButton" type="submit" style="width:100%;margin-top:18px;">Pay securely with Razorpay</button>
</form>
</div></div>
<div class="cart-summary" style="margin-top:0;padding:28px;">
<h2>Order Summary</h2><div id="checkoutItems" style="margin:18px 0;"></div>
<hr style="margin:18px 0;border:0;border-top:1px solid #eee;">
<h2>Total: <span id="checkoutTotal" style="color:var(--primary-color);">₹0.00</span></h2>
<p style="margin-top:12px;color:#666;font-size:13px;">The server confirms product prices before payment. Razorpay is currently in Test Mode.</p>
</div></div></section>
<footer><p>&copy; 2024 Fashion Hub. All Rights Reserved.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const cart = typeof getCart === "function" ? getCart() : [];
  const list = document.getElementById("checkoutItems");
  const total = document.getElementById("checkoutTotal");
  if (!cart.length) { list.textContent = "Your cart is empty."; document.getElementById("placeOrderButton").disabled = true; return; }
  let sum = 0;
  cart.forEach(item => {
    const row = document.createElement("p");
    row.style.cssText = "display:flex;justify-content:space-between;gap:12px;margin:12px 0;color:#444;";
    const name = document.createElement("span"); name.textContent = item.name + " × " + item.quantity;
    const price = document.createElement("strong"); price.textContent = formatINR(item.price * item.quantity);
    row.append(name, price); list.appendChild(row); sum += item.price * item.quantity;
  });
  total.textContent = formatINR(sum);
});
</script>
<script src="checkout.js"></script>
</body></html>
